  <text x="70" y="254" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">academic-curriculum · scientific-methodology · software-engineering</text>
  <text x="70" y="271" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11">corporate-operations · spatial-simulation · nist-csf-security (E3&gt;E2&gt;E1&gt;E0)</text>

