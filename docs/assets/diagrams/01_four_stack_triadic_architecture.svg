  <text x="70" y="176" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">universal-base · academic-base · science-base · business-base (M1..M4)</text>
  <text x="70" y="193" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11">/sopen · /continue · /sclose · /review · /enrich · /architecture · /audit · /governance</text>

  <rect x="54" y="212" width="454" height="68" rx="6" fill="#102642" stroke="#34d399" stroke-width="1"/>
