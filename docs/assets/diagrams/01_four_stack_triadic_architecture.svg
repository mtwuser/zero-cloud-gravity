    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081221"/>
      <stop offset="100%" stop-color="#0d1f38"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="480" rx="12" fill="url(#bgGrad)"/>
  <rect width="1100" height="480" rx="12" fill="url(#bpGrid)"/>
  <rect x="12" y="12" width="1076" height="456" rx="8" fill="none" stroke="#2d5a88" stroke-width="1.5"/>

