  <text x="70" y="312" fill="#fcd34d" font-family="ui-monospace,monospace" font-size="12" font-weight="700">3. tool-stack (2 + Isolated .zcg/tools/&lt;id&gt;/ Optional Providers)</text>
  <text x="70" y="332" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">self-hosted-container · google-cloud-iac · zcg-skill-auditor · osv+bwrap</text>
  <text x="70" y="349" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11">calibrated-decisions + offline LiteRT · wallet-analytics · /mcp HTTP</text>

  <rect x="54" y="368" width="454" height="62" rx="6" fill="#102642" stroke="#c084fc" stroke-width="1"/>
