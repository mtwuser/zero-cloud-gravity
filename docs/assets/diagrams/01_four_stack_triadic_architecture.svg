<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-labelledby="t1 d1">
  <title id="t1">ZeroCloudGravity 4-Stack Matrix and Triadic Node-Layer-Network Topology</title>
  <desc id="d1">Blueprint diagram showing the four orthogonal stacks (human-stack, context-stack, tool-stack, plugin-stack) composed across the Lex Superior 0..100 Node, Layer, and Network hierarchy.</desc>
  <defs>
    <pattern id="bpGrid" width="24" height="24" patternUnits="userSpaceOnUse">
