  <text x="70" y="410" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">workstation · corporate-root · node-work · tutor · secops · knowledge · wallet</text>

  <!-- Composition Bridge -->
  <path d="M 526 268 L 570 268" stroke="#7dd3fc" stroke-width="2.2" stroke-dasharray="5 4"/>
  <circle cx="548" cy="268" r="14" fill="#0f2942" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="548" y="273" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="14" font-weight="700">×</text>

