  <text x="608" y="194" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11">Declares domain_governance, SHA-256 plugin allowlist &amp; network_egress_policy</text>

  <rect x="592" y="218" width="454" height="74" rx="6" fill="#0f293a" stroke="#34d399" stroke-width="1.1"/>
  <text x="608" y="240" fill="#6ee7b7" font-family="ui-monospace,monospace" font-size="12" font-weight="700">1-HOP FUNCTIONAL, EPISTEMIC &amp; PERSONAL PILLARS (5..89)</text>
  <text x="608" y="260" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">domain-policy (5) · knowledge (gov-*/sci-*/geo-* :8720) · department (15..45)</text>
  <text x="608" y="278" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11">Personal Pillars: &lt;p&gt;-profile (:8790) · tutor · work · wallet · security · game</text>

  <rect x="592" y="304" width="454" height="62" rx="6" fill="#0f293a" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="608" y="326" fill="#fcd34d" font-family="ui-monospace,monospace" font-size="12" font-weight="700">DELIVERY SQUADS, PROJECTS &amp; rcap1 CAPSULE CONSULTATION (50..80)</text>
  <text x="608" y="346" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">rcap1 L0/L1 (88.7% / 67.0% compaction in ~16 ms) · DMCP/GRCC zero-checkout Git</text>

  <rect x="592" y="378" width="454" height="52" rx="6" fill="#132f28" stroke="#6ee7b7" stroke-width="1.1"/>
  <text x="608" y="400" fill="#a7f3d0" font-family="ui-monospace,monospace" font-size="12" font-weight="700">TWO-WORLD RECONCILIATION GUARANTEE (0 ENGINE FORKS)</text>
  <text x="608" y="418" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">zcg-sync &amp; make sync upgrade engine packs while preserving sovereign node rules</text>
