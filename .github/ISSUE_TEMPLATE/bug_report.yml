name: Bug Report
description: Report a deterministic defect in zcg CLI, zcg-mcp, templates, or node governance
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in **ZeroCloudGravity**. Please use ISO-neutral examples (`squad-iso`, `corp-iso-root`) and omit private credentials.
  - type: input
    id: component
    attributes:
      label: Affected Subpackage or Surface
      description: e.g., src/zcg/governance/bootstrap.py, zcg-mcp, templates/plugin-stack/node-work-cockpit
      placeholder: "src/zcg/..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Steps
      description: Exact CLI command or JSON-RPC payload to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Observed Behavior
      description: Reference the relevant Specification under docs/architecture/01..05 if applicable.
    validations:
      required: true
